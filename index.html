<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Пустое время — архив интернет каналов</title>
<meta name="description" content="Архив интернет каналов пустого времени.">
<link rel="canonical" href="https://emptytime.ru/">
<link rel="stylesheet" href="css/style.css">
<link rel="icon" type="image/svg+xml" href="/favicon.svg">
</head>
<body>
<header class="site-header">
  <a href="/" class="logo"><img src="/favicon.svg" alt="" width="20" height="20">Пустое время</a>
</header>
<main class="home">
  <h1>Интернет Каналы</h1>
  <p class="meta">
    <span>3 каналов в индексе</span>
  </p>
  <ul class="channel-list">
      <li>
        <a href="moscowach">
          <span class="avatar" data-letter="М"><img src="photo/moscowach.jpg" alt="" loading="lazy" onerror="this.closest('.avatar').classList.add('no-avatar')"></span>
          <span class="info">
            <span class="name">Москвач • Новости Москвы</span>
            <span class="handle"><span class="u">@moscowach</span><span class="count">0 постов</span></span>
          </span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </li>
      <li>
        <a href="tachki">
          <span class="avatar" data-letter="Т"><img src="photo/tachki.jpg" alt="" loading="lazy" onerror="this.closest('.avatar').classList.add('no-avatar')"></span>
          <span class="info">
            <span class="name">Тачки и Точка</span>
            <span class="handle"><span class="u">@tachki</span><span class="count">0 постов</span></span>
          </span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </li>
      <li>
        <a href="toporlive">
          <span class="avatar" data-letter="Т"><img src="photo/toporlive.jpg" alt="" loading="lazy" onerror="this.closest('.avatar').classList.add('no-avatar')"></span>
          <span class="info">
            <span class="name">Топор Live</span>
            <span class="handle"><span class="u">@toporlive</span><span class="count">1 пост</span></span>
          </span>
          <span class="arrow" aria-hidden="true"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></span>
        </a>
      </li>
  </ul>
</main>
<footer class="site-footer">© Пустое время</footer>
</body>
</html>
